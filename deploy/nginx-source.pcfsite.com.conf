# source.pcfsite.com: web estática (generada por build.py) con la cuenta común de pcfsite.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name source.pcfsite.com;

    ssl_certificate     /etc/letsencrypt/live/pcfsite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcfsite.com/privkey.pem;
    include snippets/cf-origen.conf;   # Authenticated Origin Pulls (inactivo hasta encenderlo en Cloudflare)

    root /var/www/source;
    index index.html;

    # control de acceso (Admin → Source): el servicio de partidas dice si pasa (abierto, autorizado o admin del foro;
    # en mantenimiento solo los administradores)
    auth_request /_acceso;
    error_page 401 = @entrar;
    error_page 403 = /_cerrado;
    location = /_acceso {
        internal;
        proxy_pass http://127.0.0.1:8870/acceso/comprobar;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;   # jugar (/jugar/…) exige sesión aunque el sitio esté abierto
        access_log off;
    }
    location @entrar { return 302 https://foro.pcfsite.com/entrar?next=https://source.pcfsite.com$request_uri; }
    # cerrado o en mantenimiento: la página la pinta el servicio (403 cerrado, 503 mantenimiento con su mensaje)
    location = /_cerrado {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8870/acceso/pagina;
        proxy_set_header Cookie $http_cookie;
        include snippets/seguridad-pcf.conf;
        add_header Cache-Control "no-store" always;
    }
    # catálogo, aviso y mantenimiento que el Admin cambia (site/pcf/estado.js lo aplica en cada página)
    location = /estado.json {
        auth_request off;
        proxy_pass http://127.0.0.1:8870/estado.json;
        access_log off;
    }
    # cabeceras comunes de pcfsite.com + CSP de este sitio (un add_header en un location anula los del server:
    # cada location con add_header propio repite las dos)
    include snippets/seguridad-pcf.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://foro.pcfsite.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://foro.pcfsite.com; form-action https://foro.pcfsite.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    # la cuenta común: el foro dice quién es (mismo origen para que viaje la cookie de pcfsite.com)
    location = /cuenta/yo {
        auth_request off;
        proxy_pass http://127.0.0.1:8850/api/yo;
        proxy_set_header Host foro.pcfsite.com;
        proxy_set_header X-Forwarded-For $remote_addr;   # la IP real (no la que mande el visitante)
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # diseño, fuentes y capturas: llevan ?v= en cada publicación
    location /pcf/ {
        include snippets/seguridad-pcf.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://foro.pcfsite.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://foro.pcfsite.com; form-action https://foro.pcfsite.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # los juegos en el navegador (WebAssembly con hilos): necesitan aislamiento entre orígenes (COOP/COEP) para
    # SharedArrayBuffer; los datos de cada juego vienen de R2 (datos.pcfsite.com, con CORS para este origen)
    location /jugar/ {
        alias /var/www/source-jugar/;
        gzip_static on;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # las de seguridad-pcf.conf salvo X-Frame-Options: el juego va incrustado en su ficha (mismo origen)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://datos.pcfsite.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'" always;
    }

    # partidas de los juegos en la cuenta de pcfsite (servicio/partidas.py); la sesión la valida el foro
    location /partidas/ {
        auth_request off;   # el servicio comprueba la sesión
        proxy_pass http://127.0.0.1:8870;
        proxy_set_header Host source.pcfsite.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
        access_log off;
        include snippets/seguridad-pcf.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # fichas con el juego incrustado: aisladas (COOP/COEP) para que el iframe de /jugar/ también lo esté. Lo que
    # cargan de otros orígenes (fotos de avatar del foro) ya lleva Cross-Origin-Resource-Policy: cross-origin
    location ~ ^/pcf[0-9]+[a-z]*$ {
        try_files $uri.html =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        include snippets/seguridad-pcf.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://foro.pcfsite.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://foro.pcfsite.com; frame-src 'self'; form-action https://foro.pcfsite.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    }

    # páginas sin .html (/pcf7, /como-funciona, /diario)
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
        include snippets/seguridad-pcf.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://foro.pcfsite.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://foro.pcfsite.com; form-action https://foro.pcfsite.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    }

    location = /_version.txt { access_log off; }
}

server {
    listen 80;
    listen [::]:80;
    server_name source.pcfsite.com;
    return 301 https://source.pcfsite.com$request_uri;
}
