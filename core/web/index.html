<!doctype html>
<html lang="es" data-juego="pcf7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover">
<!-- «Añadir a pantalla de inicio» (iOS): se abre como una app, sin las barras de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>PC Fútbol 7</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 15px system-ui, sans-serif; overflow: hidden; }
  #pantalla { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; background: #000; transition: opacity .4s; }
  #carga.fuera { opacity: 0; pointer-events: none; }
  #carga .barra { width: 220px; height: 3px; background: #222; overflow: hidden; }
  #carga .barra i { display: block; width: 40%; height: 100%; background: #c9d4e8; animation: ir 1.2s ease-in-out infinite; }
  @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #carga .aviso { max-width: 420px; text-align: center; color: #e88; display: none; }
  #precarga { position: fixed; right: 10px; bottom: 10px; padding: 5px 10px; background: rgba(0,0,0,.65); color: #c9d4e8;
              font-size: 12px; border-radius: 3px; display: none; transition: opacity .6s; pointer-events: none; }
  #precarga.fuera { opacity: 0; }
  #partida { position: fixed; left: 10px; bottom: 10px; max-width: 60%; padding: 5px 10px; background: rgba(0,0,0,.7);
             color: #d8e6d0; font-size: 12px; border-radius: 3px; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #partida.ver { opacity: 1; }
  /* pantallas táctiles (inicio.js, tactil): la barra de teclas debajo del juego */
  #tactil, #tactil-ver { display: none; }
  .tactil canvas { touch-action: none; }
  .tactil body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* el juego y la barra, en lo que queda visible de la pantalla: con el teclado del sistema abierto, encima de él
     (--vv-alto y --vv-arriba los pone inicio.js desde visualViewport) */
  .tactil #pantalla { top: var(--vv-arriba, 0px); bottom: auto; height: calc(var(--vv-alto, 100dvh) - var(--barra)); }
  .tactil.tactil-oculta #pantalla { height: var(--vv-alto, 100dvh); }
  .tactil:not(.tactil-oculta) #precarga, .tactil:not(.tactil-oculta) #partida { bottom: calc(100% - var(--vv-arriba, 0px) - var(--vv-alto, 100dvh) + var(--barra) + 10px); }
  .tactil:not(.tactil-oculta) #tactil { display: flex; }
  .tactil.tactil-oculta #tactil-ver { display: block; }
  :root { --barra: calc(46px + env(safe-area-inset-bottom)); }
  #tactil { position: fixed; left: 0; right: 0; top: calc(var(--vv-arriba, 0px) + var(--vv-alto, 100dvh) - var(--barra));
            height: var(--barra); box-sizing: border-box; flex-direction: column; justify-content: flex-end;
            background: #111; border-top: 1px solid #2a2a2a; padding-bottom: env(safe-area-inset-bottom); }
  #tactil .fila { display: flex; gap: 4px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
  #tactil .fila::-webkit-scrollbar { display: none; }
  #tactil-mas { position: absolute; left: 0; right: 0; bottom: 100%; background: #111; border-top: 1px solid #2a2a2a; }
  #tactil-mas[hidden] { display: none; }
  #tactil button, #tactil-ver { flex: 0 0 auto; min-width: 40px; height: 36px; padding: 0 10px; border: 1px solid #333;
            border-radius: 4px; background: #1d1d1d; color: #d8dde6; font: 600 14px system-ui, sans-serif; touch-action: manipulation; }
  #tactil svg, #tactil-ver svg { display: block; margin: 0 auto; }
  #tactil button:active { background: #33405a; }
  #tactil .sep { flex: 1 0 4px; }
  #tactil .teclado { position: relative; }
  #tactil.escribiendo .teclado { background: #33405a; border-color: #5a6f99; }
  /* el campo que abre el teclado del sistema: invisible, justo encima del botón ⌨ (16 px: iOS no amplía la página) */
  #tactil-texto { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; padding: 0;
                  background: transparent; color: transparent; caret-color: transparent; }
  #tactil-ver { position: fixed; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); opacity: .75; }
  #tactil-ios { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(86vw, 380px); padding: 14px 16px;
                background: #15181f; border: 1px solid #3a4459; border-radius: 6px; color: #d8dde6; font-size: 14px; line-height: 1.45; z-index: 2; }
  #tactil-ios[hidden] { display: none; }
  #tactil-ios p { margin: 0 0 10px; }
  #tactil-ios button { float: right; height: 34px; padding: 0 16px; border: 1px solid #5a6f99; border-radius: 4px; background: #33405a;
                       color: #fff; font: 600 14px system-ui, sans-serif; }
  #registro { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(0,0,0,.75);
              font: 12px ui-monospace, monospace; white-space: pre-wrap; max-height: 30vh; overflow: auto; display: none; }
</style>
</head>
<body>
<div id="pantalla"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="carga"><div id="carga-texto">Cargando…</div><div class="barra"><i></i></div><div class="aviso" id="aviso"></div></div>
<div id="precarga"></div>
<div id="partida"></div>
<div id="registro"></div>
<div id="tactil" aria-label="Teclas">
  <div class="fila" id="tactil-mas" hidden>
    <button data-tecla="F1">F1</button><button data-tecla="F2">F2</button><button data-tecla="F3">F3</button>
    <button data-tecla="F4">F4</button><button data-tecla="F5">F5</button><button data-tecla="F6">F6</button>
    <button data-tecla="F7">F7</button><button data-tecla="F8">F8</button><button data-tecla="F9">F9</button>
    <button data-tecla="F10">F10</button><button data-tecla="Delete">Supr</button><button data-tecla="Home">Inicio</button>
    <button data-tecla="End">Fin</button><button data-tecla="PageUp">RePág</button><button data-tecla="PageDown">AvPág</button>
  </div>
  <div class="fila">
    <button class="teclado" aria-label="Teclado"><svg viewBox="0 0 24 16" width="24" height="16" aria-hidden="true"><rect x=".75" y=".75" width="22.5" height="14.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="currentColor" d="M4 4h2v2H4zM8 4h2v2H8zM12 4h2v2h-2zM16 4h2v2h-2zM4 8h2v2H4zM8 8h2v2H8zM12 8h2v2h-2zM16 8h4v2h-4zM7 11.5h10v1.5H7z"/></svg><input id="tactil-texto" type="text" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Escribir"></button>
    <button data-tecla="Escape">Esc</button><button data-tecla="Enter">Intro</button><button data-tecla="Backspace">⌫</button>
    <button data-tecla="Tab">Tab</button><button data-tecla="ArrowLeft">←</button><button data-tecla="ArrowUp">↑</button>
    <button data-tecla="ArrowDown">↓</button><button data-tecla="ArrowRight">→</button><button id="tactil-f">F1–F10 ▴</button>
    <span class="sep"></span><button id="tactil-completa" aria-label="Pantalla completa"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M1 5.5V1h4.5M10.5 1H15v4.5M15 10.5V15h-4.5M5.5 15H1v-4.5"/></svg></button>
    <button id="tactil-ocultar" aria-label="Ocultar las teclas">▾</button>
  </div>
</div>
<div id="tactil-ios" hidden><p>En el iPhone, Safari no deja poner una página a pantalla completa.</p>
  <p>Para jugar sin las barras de Safari: pulsa <b>Compartir</b> y luego <b>«Añadir a pantalla de inicio»</b>, y abre el
  juego desde ese icono. Se abre como una app, a toda pantalla.</p><button id="tactil-ios-vale">Vale</button></div>
<button id="tactil-ver" aria-label="Ver las teclas"><svg viewBox="0 0 24 16" width="24" height="16" aria-hidden="true"><rect x=".75" y=".75" width="22.5" height="14.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="currentColor" d="M4 4h2v2H4zM8 4h2v2H8zM12 4h2v2h-2zM16 4h2v2h-2zM4 8h2v2H4zM8 8h2v2H8zM12 8h2v2h-2zM16 8h4v2h-4zM7 11.5h10v1.5H7z"/></svg></button>
<script src="partidas.js"></script>
<script src="inicio.js"></script>
</body>
</html>
